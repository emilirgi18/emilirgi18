<svg xmlns="http://www.w3.org/2000/svg" width="840" height="372" viewBox="0 0 840 372" role="img" aria-labelledby="title desc">
  <title id="title">emil.ts</title>
  <desc id="desc">A code editor window introducing Emil: Full-Stack Developer at Komune Studio since 2022, based in Indonesia. Studied Informatik at THM in Germany and IT at Swiss German University. Builds web apps, backends and mobile apps. Off the clock: J-Pop, music covers, games and TTRPG.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="0.5" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="838" height="370" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .code { font: 15px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; white-space: pre; }
    .ln { fill: #484f58; text-anchor: end; }
    .t { fill: #e6edf3; }
    .k { fill: #ff7b72; }
    .v { fill: #ffa657; }
    .p { fill: #79c0ff; }
    .s { fill: #a5d6ff; }
    .c { fill: #8b949e; font-style: italic; }
    .tab { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #8b949e; text-anchor: middle; }
    .line { opacity: 0; animation: in 0.4s ease-out forwards; }
    .cursor { fill: #79c0ff; animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="372" fill="#0d1117"/>
    <rect width="840" height="40" fill="#161b22"/>
    <line x1="0" y1="40.5" x2="840" y2="40.5" stroke="#30363d"/>
  </g>
  <rect x="0.75" y="0.75" width="838.5" height="370.5" rx="12" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text class="tab" x="420" y="25">emil.ts</text>

  <g class="code" xml:space="preserve">
    <text class="ln" x="44" y="76">1</text>
    <text class="ln" x="44" y="102">2</text>
    <text class="ln" x="44" y="128">3</text>
    <text class="ln" x="44" y="154">4</text>
    <text class="ln" x="44" y="180">5</text>
    <text class="ln" x="44" y="206">6</text>
    <text class="ln" x="44" y="232">7</text>
    <text class="ln" x="44" y="258">8</text>
    <text class="ln" x="44" y="284">9</text>
    <text class="ln" x="44" y="310">10</text>
    <text class="ln" x="44" y="336">11</text>

    <text class="line" x="64" y="76" style="animation-delay:0.1s"><tspan class="c">// nice to meet you</tspan></text>
    <text class="line" x="64" y="102" style="animation-delay:0.25s"><tspan class="k">const</tspan><tspan class="t"> </tspan><tspan class="v">emil</tspan><tspan class="t"> = {</tspan></text>
    <text class="line" x="64" y="128" style="animation-delay:0.4s"><tspan class="t">  </tspan><tspan class="p">role</tspan><tspan class="t">: </tspan><tspan class="s">"Full-Stack Developer"</tspan><tspan class="t">,</tspan></text>
    <text class="line" x="64" y="154" style="animation-delay:0.55s"><tspan class="t">  </tspan><tspan class="p">company</tspan><tspan class="t">: </tspan><tspan class="s">"Komune Studio"</tspan><tspan class="t">, </tspan><tspan class="c">// since 2022</tspan></text>
    <text class="line" x="64" y="180" style="animation-delay:0.7s"><tspan class="t">  </tspan><tspan class="p">basedIn</tspan><tspan class="t">: </tspan><tspan class="s">"Indonesia"</tspan><tspan class="t">,</tspan></text>
    <text class="line" x="64" y="206" style="animation-delay:0.85s"><tspan class="t">  </tspan><tspan class="p">studied</tspan><tspan class="t">: [</tspan><tspan class="s">"Informatik @ THM, Germany"</tspan><tspan class="t">, </tspan><tspan class="s">"IT @ Swiss German University"</tspan><tspan class="t">],</tspan></text>
    <text class="line" x="64" y="232" style="animation-delay:1s"><tspan class="t">  </tspan><tspan class="p">builds</tspan><tspan class="t">: [</tspan><tspan class="s">"web apps"</tspan><tspan class="t">, </tspan><tspan class="s">"backends"</tspan><tspan class="t">, </tspan><tspan class="s">"mobile apps"</tspan><tspan class="t">],</tspan></text>
    <text class="line" x="64" y="258" style="animation-delay:1.15s"><tspan class="t">  </tspan><tspan class="p">offTheClock</tspan><tspan class="t">: [</tspan><tspan class="s">"J-Pop"</tspan><tspan class="t">, </tspan><tspan class="s">"music covers"</tspan><tspan class="t">, </tspan><tspan class="s">"games"</tspan><tspan class="t">, </tspan><tspan class="s">"TTRPG"</tspan><tspan class="t">],</tspan></text>
    <text class="line" x="64" y="284" style="animation-delay:1.3s"><tspan class="t">};</tspan></text>
    <text class="line" x="64" y="336" style="animation-delay:1.45s"><tspan class="k">export default</tspan><tspan class="t"> </tspan><tspan class="v">emil</tspan><tspan class="t">;</tspan><tspan class="cursor">█</tspan></text>
  </g>
</svg>
